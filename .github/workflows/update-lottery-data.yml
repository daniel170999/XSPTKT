name: Cập nhật dữ liệu xổ số

on:
  schedule:
    # GitHub Actions dùng UTC. 17:37 và 19:37 giờ Việt Nam, sau hai kỳ quay.
    - cron: "37 10 * * *"
    - cron: "37 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lottery-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tải kết quả mới
        run: python update.py --max-fetch 40
      - name: Chỉ commit khi dữ liệu thực sự đổi
        run: |
          if git diff --quiet -- data; then
            echo "Không có dữ liệu mới."
            exit 0
          fi
          git config user.name "xs-data-bot"
          git config user.email "xs-data-bot@users.noreply.github.com"
          git add data
          git commit -m "data: cập nhật kết quả xổ số"
          git push
