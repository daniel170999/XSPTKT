name: Cập nhật dữ liệu xổ số

on:
  schedule:
    # GitHub Actions dùng UTC. 16:42 và 18:42 giờ Việt Nam, sau hai kỳ quay.
    # Chọn phút 42 để tránh cao điểm đầu giờ; lịch schedule vẫn có thể bị GitHub trì hoãn.
    - cron: "42 9 * * *"
    - cron: "42 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lottery-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Chạy kiểm thử crawler
        run: python test_update.py
      - name: Tải kết quả mới
        run: python update.py --max-fetch 40
      - name: Tạo trang kết quả tĩnh
        run: python build_pages.py --days 90
      - name: Kiểm tra ngôn ngữ công khai
        run: python work/check_words.py
      - name: Chỉ commit khi dữ liệu thực sự đổi
        run: |
          if git diff --quiet -- data index.html site-schema.js sitemap.xml robots.txt privacy.html xsmn xsmb gioi-thieu nguon-du-lieu phuong-phap lien-he; then
            echo "Không có dữ liệu mới."
            exit 0
          fi
          git config user.name "xs-data-bot"
          git config user.email "xs-data-bot@users.noreply.github.com"
          git add data index.html site-schema.js sitemap.xml robots.txt privacy.html xsmn xsmb gioi-thieu nguon-du-lieu phuong-phap lien-he
          git commit -m "data: cập nhật kết quả xổ số"
          git push
